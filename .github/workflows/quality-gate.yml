name: Quality Gate Inicial

on:
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required documentation
        run: |
          test -f README.md
          test -f docs/quality/CTQ.md
          test -f docs/quality/DoD.md

      - name: Check Markdown basic quality
        run: |
          echo "Validando documentación Markdown..."
          grep -q "CTQ" docs/quality/CTQ.md
          grep -q "Definition of Done" docs/quality/DoD.md

      - name: Validate required web files
        run: |
          test -f src/index.html
          test -f src/styles.css
          test -f src/script.js
          echo "Archivos base del sitio verificados"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HTMLHint
        run: npm install -g htmlhint

      - name: Run HTML linter
        run: htmlhint src/index.html

      - name: Gate completado
        run: echo "Quality Gate inicial completado exitosamente"